[project]
name = "mmm-guide"
version = "0.1.0"
description = "Marketing Mix Modelling - Complete Guide with Practical Implementation"
# Upper bound is deliberate: pymc/pytensor have no released build for Python 3.13+
# yet, and hosts that default to the newest available interpreter (e.g. Streamlit
# Community Cloud) will otherwise fail dependency resolution entirely. See
# runtime.txt, which pins the same range for hosts that read it directly.
requires-python = ">=3.11,<3.13"
dependencies = [
    # Data manipulation
    # Upper bound is deliberate, same rationale as the Python range above:
    # an unvetted future major pandas release should fail dependency
    # resolution loudly rather than get silently installed and only found
    # to be incompatible (or not) once something already broke in CI (see
    # docs/decision_log.md's pandas4/pyarrow-in-a-thread AppTest note - 4.x
    # already has at least one known incompatibility here).
    # Lower bound: previously declared >=2.0.0, but every locked
    # environment (uv.lock) and every CI job has only ever resolved and
    # tested pandas 3.x - pandas 2 compatibility was an untested, aspirational
    # claim, not a verified one. Narrowed to what is actually exercised;
    # widen it again only alongside real pandas-2-pinned CI coverage.
    "pandas>=3.0.0,<4.0.0",
    "numpy>=1.24.0",
    # Bayesian modelling
    "pymc==5.28.5",
    "pytensor==2.38.3",
    "pymc-marketing==0.19.2; python_version < '3.12'",
    "pymc-marketing==0.19.4; python_version >= '3.12'",
    "arviz==0.23.4",
    # Visualization
    "matplotlib>=3.7.0",
    "seaborn>=0.13.0",
    "plotly>=5.18.0",
    # Streamlit app (ancestry_mmm/)
    "streamlit>=1.30.0",
    # Statistics and ML utilities
    "scikit-learn>=1.3.0",
    "statsmodels>=0.14.0",
    "scipy>=1.11.0",
    # Progress bars
    "tqdm>=4.66.0",
    # Excel support (for data dictionary)
    "openpyxl>=3.1.0",
    "graphviz>=0.21",
    # Parquet read/write for project persistence (ancestry_mmm/core/persistence.py)
    "pyarrow>=14.0.0",
]

[project.optional-dependencies]
api = [
    "fastapi>=0.109.0",
    "uvicorn[standard]>=0.27.0",
    "python-multipart>=0.0.6",
]

# Dev tooling lives only here, not duplicated under [project.optional-
# dependencies] - nothing in this repo ever installs it via `pip install
# .[dev]`/`uv sync --extra dev` (CI and local development both use
# `uv sync --locked`, which includes this default dependency-group
# automatically). A second, identical copy previously existed under
# optional-dependencies purely as dead duplication - every new dev
# dependency had to be remembered and added to both lists, or the two
# would silently drift apart.
[dependency-groups]
dev = [
    "black>=23.0.0",
    "ruff>=0.1.0",
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "mypy>=1.7.0",
    "pip-audit>=2.7.0",
    "bandit>=1.7.5",
    "pytest-playwright>=0.5.2",
    # test_official_lifecycle_browser.py polls the Streamlit health-check
    # endpoint directly with httpx before driving the browser. Previously
    # present only by accident, as a transitive dependency of jupyterlab
    # (moved to the notebook group below) - never a declared dependency of
    # anything that actually needs it.
    "httpx>=0.28.0",
]

# Notebook exploration tooling (mmm_complete_example.ipynb and friends at the
# repo root). Not imported anywhere under ancestry_mmm/ - the Streamlit app
# and its tests never need it - so it does not belong in [project]
# dependencies, which install on every `uv sync --locked` (the app's actual
# runtime footprint, including on hosts like Streamlit Community Cloud that
# have no use for a notebook kernel). A non-default dependency-group is not
# installed by a plain `uv sync --locked`; run `uv sync --locked --group
# notebook` to add it locally.
notebook = [
    "jupyter>=1.0.0",
    "jupyterlab>=4.0.0",
    "ipykernel>=6.25.0",
    "ipywidgets>=8.1.0",
]

[tool.uv]
# Repository-controlled pin for the uv executable itself (not the Python
# packages it resolves - see uv.lock for those). Without this, both local
# `uv` invocations and astral-sh/setup-uv in CI (which reads this field by
# default when no explicit `version`/`version-file` input is given) install
# whichever uv release happens to be current that day - a moving target
# that can change resolver/lock behaviour between two otherwise-identical
# runs. `uv` itself enforces this: any `uv` command refuses to run under a
# different version. Bump deliberately, in its own commit, when adopting a
# new uv release.
required-version = "==0.12.0"

[tool.pytest.ini_options]
testpaths = ["ancestry_mmm/tests"]
addopts = [
    "--tb=short",
    "--strict-markers",
    "--cov=ancestry_mmm",
    "--cov-report=term-missing:skip-covered",
    # This is a lenient floor for any partial/ad-hoc pytest invocation
    # (a single test file, one CI job's narrow subset) - it is NOT the
    # project's real coverage bar. The full-suite CI jobs (Python 3.11/3.12
    # tests) explicitly pass --cov-fail-under=75 on the command line, which
    # overrides this default; several other CI jobs run a narrow subset
    # (Streamlit AppTest, test_persistence.py, test_simulation_recovery.py)
    # and rely on this lower default instead - raising it here would fail
    # those jobs, which never exercise enough of the package to clear 75%.
    "--cov-fail-under=30",
]
# Warning ledger: any warning not explicitly allow-listed below fails the
# test it occurs in. Without this, a newly-introduced warning (a real
# regression, or scope creep from an upgraded dependency) is invisible -
# it prints once in a wall of test output and nobody notices. Every entry
# below is a warning already known and accounted for as of PR 123; adding
# a new one requires updating this list deliberately, not silently.
filterwarnings = [
    "error",
    # Our own code's deliberate, already-tracked deprecations (each
    # message documents its own migration path) - not new regressions.
    "ignore:curve_type=None is deprecated and ungoverned.*:DeprecationWarning",
    "ignore:String objectives are deprecated.*:DeprecationWarning",
    # Third-party library warnings we do not control and cannot fix here.
    "ignore:Scan return signature will change.*:DeprecationWarning",
    # CI-runner-specific (no BLAS linked on GitHub Actions' Ubuntu images;
    # never fires on a local machine with BLAS installed) - a PyTensor
    # infrastructure notice about the runner environment, not our code.
    "ignore:PyTensor could not link to a BLAS installation.*:UserWarning",
    # NOTE: data/loader.py's column-type auto-detection deliberately probes
    # arbitrary uploaded columns with pd.to_datetime and no fixed format,
    # which pandas warns about ("Could not infer format..."). That warning
    # is suppressed locally around the probe itself (see loader.py), not
    # here - a repo-wide ignore would also hide the same warning from any
    # other, non-probing date-conversion path (data/pipeline.py,
    # data/preprocessor.py), where it could mean a genuinely inconsistent
    # format worth surfacing.
]

[tool.coverage.run]
source = ["ancestry_mmm"]
omit = [
    "ancestry_mmm/tests/*",
    "ancestry_mmm/sample_data/*",
    "ancestry_mmm/pages/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "return None  # pragma: no cover",
    "def __repr__",
    "if __name__ == .__main__.:",
]

[tool.ruff.lint]
# Keep CI on Ruff's established correctness-focused default rules even as
# newer Ruff releases expand their global defaults.
select = ["E4", "E7", "E9", "F"]

[tool.ruff.format]
# Enable formatting verification in addition to lint checks
preview = false

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
warn_unused_ignores = true
ignore_missing_imports = true
disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = false
no_implicit_optional = true
warn_redundant_casts = true
# Modules excluded from type-checking (tolerance zone)
exclude = [
    "ancestry_mmm/tests/",
    "ancestry_mmm/sample_data/",
    "ancestry_mmm/pages/",
    "archive/",
]

[tool.bandit]
exclude_dirs = [
    "ancestry_mmm/tests",
    "ancestry_mmm/sample_data",
    "archive",
]
skips = [
    "B101",  # assert statements are acceptable in tests and internal code
    "B301",  # pickle usage is acceptable for known internal formats
    "B403",  # pickle permissions
]

[tool.setuptools.packages.find]
include = ["ancestry_mmm*"]
exclude = ["archive*"]
