name: Tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    # Weekly Monday morning deterministic attribution recovery run
    - cron: "0 6 * * 1"
  workflow_dispatch:
    inputs:
      reason:
        description: "Reason for manual run"
        required: false
        default: "Manual trigger"

jobs:
  # -- Early compile and import check ---------------------------------
  compile-and-import:
    name: Compile + Import
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v8.3.2
        with:
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: "uv.lock"
      - run: uv sync --locked
      - name: Compile package
        run: uv run python -m compileall -q ancestry_mmm
      - name: Import critical modules
        run: |
          uv run python -c "import ancestry_mmm.core.validation_policy"
          uv run python -c "import ancestry_mmm.application.validation_service"
          uv run python -c "import ancestry_mmm.core.optimization"
          uv run python -c "import ancestry_mmm.core.planning_governance"
          uv run python -c "import ancestry_mmm.application.scenario_service"
          uv run python -c "import ancestry_mmm.core.persistence"
          uv run python -c "import ancestry_mmm.core.model_identity"

  # -- Windows dev-tooling integration -------------------------------
  # Executes the PowerShell setup and checker scripts on Windows,
  # then starts Streamlit via the launcher and health-checks it.
  windows-tooling:
    name: Windows tooling
    runs-on: windows-latest
    defaults:
      run:
        shell: powershell
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v8.3.2
        with:
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: "uv.lock"
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: uv sync --locked
      - name: Set CI root and MMM_DEV_ROOT
        run: |
          $ciRoot = Join-Path $env:RUNNER_TEMP "Ancestry-MMM"
          "MMM_DEV_ROOT=$ciRoot" | Out-File -FilePath $env:GITHUB_ENV -Append
          Write-Host "CI root: $ciRoot"
      - name: Parse all PowerShell scripts (Windows PowerShell 5.1)
        shell: powershell
        run: |
          $errors = @()
          Get-ChildItem scripts\*.ps1 | ForEach-Object {
            $tokens = $null
            $parseErrors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              $_.FullName, [ref]$tokens, [ref]$parseErrors
            ) | Out-Null
            if ($parseErrors.Count -gt 0) {
              $errors += $_.Name
              $parseErrors | Format-List
            }
          }
          if ($errors.Count -gt 0) {
            throw "PowerShell parse failures: $($errors -join ', ')"
          }
          Write-Host "All PowerShell scripts parse successfully."
      - name: Run setup script (operational dirs only)
        run: powershell -NoProfile -ExecutionPolicy Bypass -File scripts/setup_dev_tooling.ps1
      - name: Verify operational directories exist
        run: |
          $ciRoot = $env:MMM_DEV_ROOT
          foreach ($d in @("cache\npm","cache\ms-playwright","temp","test-artifacts\playwright-mcp","logs\mcp")) {
            $full = Join-Path $ciRoot $d
            if (Test-Path $full) { Write-Host "[OK] $full" } else { Write-Host "[FAIL] $full"; exit 1 }
          }
      - name: Install Chromium for CI
        run: |
          $env:PLAYWRIGHT_BROWSERS_PATH = Join-Path $env:MMM_DEV_ROOT "cache\ms-playwright"
          $env:npm_config_cache = Join-Path $env:MMM_DEV_ROOT "cache\npm"
          # Use the Playwright MCP package's own install-browser command.
          # This version matches the pinned @playwright/mcp@0.0.78.
          npx -y @playwright/mcp@0.0.78 install-browser chrome-for-testing
      - name: Run prerequisite checker
        run: powershell -NoProfile -ExecutionPolicy Bypass -File scripts/check_mcp_prereqs.ps1
      - name: Start Streamlit and health-check
        shell: powershell
        run: |
          $workspace = $env:GITHUB_WORKSPACE
          $ciRoot = $env:MMM_DEV_ROOT
          $proc = $null
          try {
            # Start Streamlit via Start-Process -PassThru (without
            # -NoNewWindow so the child is detached and can be killed).
            # The process inherits PATH (including uv) from this session.
            $proc = Start-Process -FilePath powershell.exe `
              -ArgumentList "-NoProfile -ExecutionPolicy Bypass -File scripts\start_dev_app.ps1" `
              -WorkingDirectory $workspace `
              -PassThru
            # Poll for readiness (bounded retries)
            $ready = $false
            for ($i = 0; $i -lt 30; $i++) {
              Start-Sleep 3
              try {
                $response = Invoke-WebRequest -Uri "http://127.0.0.1:8501" -UseBasicParsing -TimeoutSec 5
                if ($response.StatusCode -eq 200) { $ready = $true; break }
              } catch { }
            }
            if (-not $ready) { throw "Streamlit did not become ready within 90 seconds" }
            Write-Host "Streamlit responded: HTTP 200"
          } finally {
            # Guaranteed cleanup: kill the process tree
            if ($proc -and -not $proc.HasExited) {
              Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue
              # Also kill any child processes holding port 8501
              Get-Process | Where-Object { $_.ProcessName -like "*python*" } | Stop-Process -Force -ErrorAction SilentlyContinue
            }
            Start-Sleep 5
            $portInUse = Get-NetTCPConnection -LocalPort 8501 -State Listen -ErrorAction SilentlyContinue
            if ($portInUse) {
              Write-Error "Port 8501 still in use after cleanup."
              exit 1
            }
            Write-Host "Port 8501 free."
          }
        timeout-minutes: 5

  # -- Python 3.11 unit/integration ----------------------------------
  py311-tests:
    name: Python 3.11 tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v8.3.2
        with:
          python-version: "3.11"
          enable-cache: true
          cache-dependency-glob: "uv.lock"
      - run: uv sync --locked
      - name: Assert pinned pymc-marketing (3.11)
        env:
          EXPECTED_PYMC_MARKETING: "0.19.2"
        run: |
          uv run python -c "import os, pymc_marketing; assert pymc_marketing.__version__ == os.environ['EXPECTED_PYMC_MARKETING'], (pymc_marketing.__version__, os.environ['EXPECTED_PYMC_MARKETING'])" &&
          uv run pytest ancestry_mmm/tests/test_transformations.py -k pymc_marketing -v --no-cov
      - name: Run tests with coverage
        run: uv run pytest ancestry_mmm/tests/ -q --ignore=ancestry_mmm/tests/test_persistence.py --cov --cov-report=term-missing:skip-covered --cov-fail-under=75

  # -- Python 3.12 unit/integration ----------------------------------
  py312-tests:
    name: Python 3.12 tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v8.3.2
        with:
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: "uv.lock"
      - run: uv sync --locked
      - name: Assert pinned pymc-marketing (3.12)
        env:
          EXPECTED_PYMC_MARKETING: "0.19.4"
        run: |
          uv run python -c "import os, pymc_marketing; assert pymc_marketing.__version__ == os.environ['EXPECTED_PYMC_MARKETING'], (pymc_marketing.__version__, os.environ['EXPECTED_PYMC_MARKETING'])" &&
          uv run pytest ancestry_mmm/tests/test_transformations.py -k pymc_marketing -v --no-cov
      - name: Run tests with coverage
        run: uv run pytest ancestry_mmm/tests/ -q --ignore=ancestry_mmm/tests/test_persistence.py --cov --cov-report=term-missing:skip-covered --cov-fail-under=75

  # -- Ruff lint and format check -------------------------------------
  ruff:
    name: Ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v8.3.2
        with:
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: "uv.lock"
      - run: uv sync --locked
      - name: Run ruff check
        run: uv run ruff check ancestry_mmm
      - name: Run ruff format check
        run: uv run ruff format --check ancestry_mmm

  # -- Mypy type checking ---------------------------------------------
  mypy:
    name: Mypy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v8.3.2
        with:
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: "uv.lock"
      - run: uv sync --locked
      - name: Run mypy (planning + validation blocked)
        run: |
          uv run mypy ancestry_mmm/core/planning --ignore-missing-imports --follow-imports=silent
          uv run mypy ancestry_mmm/core/validation_policy.py --ignore-missing-imports --follow-imports=silent
          uv run mypy ancestry_mmm/application --ignore-missing-imports --follow-imports=silent
          uv run mypy ancestry_mmm/core --ignore-missing-imports || true  # 319 errors tracked in issue #78

  # -- Bandit security scan -------------------------------------------
  bandit:
    name: Bandit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v8.3.2
        with:
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: "uv.lock"
      - run: uv sync --locked
      - name: Run bandit
        run: uv run bandit -r ancestry_mmm/core -c pyproject.toml

  # -- pip-audit dependency scan --------------------------------------
  pip-audit:
    name: pip-audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v8.3.2
        with:
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: "uv.lock"
      - run: uv sync --locked
      - name: Export requirements and audit
        run: |
          uv pip compile pyproject.toml > /tmp/requirements.txt
          uv run pip-audit -r /tmp/requirements.txt
        continue-on-error: false  # Blocking enforcement active

  # -- Requirement-index conformance ----------------------------------
  req-index:
    name: Requirements index
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v8.3.2
        with:
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: "uv.lock"
      - run: uv sync --locked
      - name: Run requirement-index conformance tests
        run: uv run pytest ancestry_mmm/tests/test_requirements_index_conformance.py -v --no-cov

  # -- Streamlit AppTest ----------------------------------------------
  streamlit:
    name: Streamlit AppTest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v8.3.2
        with:
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: "uv.lock"
      - run: uv sync --locked
      - name: Run Streamlit smoke tests
        run: uv run pytest ancestry_mmm/tests/test_streamlit_smoke.py ancestry_mmm/tests/test_scenario_planner_apptest.py -v

  # -- Bundle round-trip ----------------------------------------------
  bundle:
    name: Bundle round-trip
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v8.3.2
        with:
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: "uv.lock"
      - run: uv sync --locked
      - name: Run bundle round-trip tests
        run: uv run pytest ancestry_mmm/tests/test_persistence.py -v

  # -- Deterministic attribution recovery (schedule/manual only) --
  # NOTE: This is NOT MCMC parameter recovery. It tests deterministic
  # replay and attribution using known parameters. A full MCMC recovery
  # test (fitting a PyMC model and evaluating posterior recovery) remains
  # uncommitted. See docs/approved_requirements/ for the capability roadmap.
  deterministic-recovery:
    name: Deterministic attribution recovery
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v8.3.2
        with:
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: "uv.lock"
      - run: uv sync --locked
      - name: Run deterministic attribution recovery tests
        run: uv run pytest ancestry_mmm/tests/test_simulation_recovery.py -v --tb=short
        timeout-minutes: 60
