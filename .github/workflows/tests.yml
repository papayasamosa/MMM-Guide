name: Tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    # Weekly Monday morning deterministic attribution recovery run
    - cron: "0 6 * * 1"
  workflow_dispatch:
    inputs:
      reason:
        description: "Reason for manual run"
        required: false
        default: "Manual trigger"

jobs:
  # -- Early compile and import check ---------------------------------
  compile-and-import:
    name: Compile + Import
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v8.3.2
        with:
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: "uv.lock"
      - run: uv sync --locked
      - name: Compile package
        run: uv run python -m compileall -q ancestry_mmm
      - name: Import critical modules
        run: |
          uv run python -c "import ancestry_mmm.core.validation_policy"
          uv run python -c "import ancestry_mmm.application.validation_service"
          uv run python -c "import ancestry_mmm.core.optimization"
          uv run python -c "import ancestry_mmm.core.planning_governance"
          uv run python -c "import ancestry_mmm.application.scenario_service"
          uv run python -c "import ancestry_mmm.core.persistence"
          uv run python -c "import ancestry_mmm.core.model_identity"

  # -- Windows dev-tooling integration -------------------------------
  # Executes the PowerShell setup and checker scripts on Windows,
  # then starts Streamlit via the launcher and health-checks it.
  windows-tooling:
    name: Windows tooling
    runs-on: windows-latest
    defaults:
      run:
        shell: powershell
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v8.3.2
        with:
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: "uv.lock"
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: uv sync --locked
      - name: Set CI root and MMM_DEV_ROOT
        run: |
          $ciRoot = Join-Path $env:RUNNER_TEMP "Ancestry-MMM"
          "MMM_DEV_ROOT=$ciRoot" | Out-File -FilePath $env:GITHUB_ENV -Append
          Write-Host "CI root: $ciRoot"
      - name: Parse all PowerShell scripts (Windows PowerShell 5.1)
        shell: powershell
        run: |
          $errors = @()
          Get-ChildItem scripts\*.ps1 | ForEach-Object {
            $tokens = $null
            $parseErrors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              $_.FullName, [ref]$tokens, [ref]$parseErrors
            ) | Out-Null
            if ($parseErrors.Count -gt 0) {
              $errors += $_.Name
              $parseErrors | Format-List
            }
          }
          if ($errors.Count -gt 0) {
            throw "PowerShell parse failures: $($errors -join ', ')"
          }
          Write-Host "All PowerShell scripts parse successfully."
      - name: Run setup script (operational dirs only)
        run: powershell -NoProfile -ExecutionPolicy Bypass -File scripts/setup_dev_tooling.ps1
      - name: Verify operational directories exist
        run: |
          $ciRoot = $env:MMM_DEV_ROOT
          foreach ($d in @("cache\npm","cache\ms-playwright","temp","test-artifacts\playwright-mcp","logs\mcp")) {
            $full = Join-Path $ciRoot $d
            if (Test-Path $full) { Write-Host "[OK] $full" } else { Write-Host "[FAIL] $full"; exit 1 }
          }
      - name: Install Chromium for CI
        run: |
          $env:PLAYWRIGHT_BROWSERS_PATH = Join-Path $env:MMM_DEV_ROOT "cache\ms-playwright"
          $env:npm_config_cache = Join-Path $env:MMM_DEV_ROOT "cache\npm"
          # Use the Playwright MCP package's own install-browser command.
          # This version matches the pinned @playwright/mcp@0.0.78.
          npx -y @playwright/mcp@0.0.78 install-browser chrome-for-testing
      - name: Run prerequisite checker
        run: powershell -NoProfile -ExecutionPolicy Bypass -File scripts/check_mcp_prereqs.ps1
      - name: Start Streamlit and health-check
        shell: powershell
        run: |
          $workspace = $env:GITHUB_WORKSPACE
          $ciRoot = $env:MMM_DEV_ROOT
          $proc = $null
          try {
            # Start Streamlit via Start-Process -PassThru (without
            # -NoNewWindow so the child is detached and can be killed).
            # The process inherits PATH (including uv) from this session.
            $proc = Start-Process -FilePath powershell.exe `
              -ArgumentList "-NoProfile -ExecutionPolicy Bypass -File scripts\start_dev_app.ps1" `
              -WorkingDirectory $workspace `
              -PassThru
            # Poll for readiness (bounded retries)
            $ready = $false
            for ($i = 0; $i -lt 30; $i++) {
              Start-Sleep 3
              try {
                $response = Invoke-WebRequest -Uri "http://127.0.0.1:8501" -UseBasicParsing -TimeoutSec 5
                if ($response.StatusCode -eq 200) { $ready = $true; break }
              } catch { }
            }
            if (-not $ready) { throw "Streamlit did not become ready within 90 seconds" }
            Write-Host "Streamlit responded: HTTP 200"
          } finally {
            # Guaranteed cleanup: kill the process tree
            if ($proc -and -not $proc.HasExited) {
              Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue
              # Also kill any child processes holding port 8501
              Get-Process | Where-Object { $_.ProcessName -like "*python*" } | Stop-Process -Force -ErrorAction SilentlyContinue
            }
            Start-Sleep 5
            $portInUse = Get-NetTCPConnection -LocalPort 8501 -State Listen -ErrorAction SilentlyContinue
            if ($portInUse) {
              Write-Error "Port 8501 still in use after cleanup."
              exit 1
            }
            Write-Host "Port 8501 free."
          }
        timeout-minutes: 5
      - name: Repoint MMM_DEV_ROOT to a guaranteed D:-drive path for Graphify
        run: |
          $graphifyRoot = "D:\Ancestry-MMM-Graphify-CI"
          "MMM_DEV_ROOT=$graphifyRoot" | Out-File -FilePath $env:GITHUB_ENV -Append
          Write-Host "Graphify CI root: $graphifyRoot"
      - name: Install Graphify (D-drive isolated uv tool)
        run: powershell -NoProfile -ExecutionPolicy Bypass -File scripts/setup_graphify.ps1
      - name: Verify Graphify installed only under D:-drive paths
        run: |
          $root = $env:MMM_DEV_ROOT
          foreach ($rel in @("tools\uv\tools", "tools\uv\bin", "cache\uv")) {
            $full = Join-Path $root $rel
            if (-not (Test-Path $full)) { Write-Error "$full missing"; exit 1 }
            if (-not $full.StartsWith("D:", [System.StringComparison]::OrdinalIgnoreCase)) {
              Write-Error "$full is not on D:"; exit 1
            }
          }
          $legacyBin = Join-Path $env:USERPROFILE ".local\bin\graphify-mcp.exe"
          if (Test-Path $legacyBin) {
            Write-Error "Graphify was installed under %USERPROFILE%\.local - D-drive isolation violated."
            exit 1
          }
          Write-Host "Graphify install confirmed D-drive-only; no %USERPROFILE%\.local install present."
      - name: Run Graphify prerequisite checker
        run: powershell -NoProfile -ExecutionPolicy Bypass -File scripts/check_graphify_prereqs.ps1
      - name: Graphify checker must reject a C-drive tool root
        run: |
          $env:MMM_DEV_ROOT = "C:\Ancestry-MMM-Should-Fail"
          powershell -NoProfile -ExecutionPolicy Bypass -File scripts/check_graphify_prereqs.ps1
          if ($LASTEXITCODE -eq 0) {
            Write-Error "Checker incorrectly passed against a C: root"
            exit 1
          }
          $rejectedExitCode = $LASTEXITCODE
          Write-Host "Checker correctly rejected a C:-drive root (exit $rejectedExitCode)."
          exit 0
      - name: Graphify launcher must reject a missing graph
        run: |
          # graphify-out/graph.json does not exist on a fresh checkout - the
          # launcher must fail closed rather than hang or partially start.
          powershell -NoProfile -ExecutionPolicy Bypass -File scripts/run_graphify_mcp.ps1
          if ($LASTEXITCODE -eq 0) {
            Write-Error "Launcher incorrectly succeeded with no graph present"
            exit 1
          }
          $rejectedExitCode = $LASTEXITCODE
          Write-Host "Launcher correctly rejected the missing graph (exit $rejectedExitCode)."
          exit 0
      - name: Graphify launcher must reject a C-drive tool-bin override
        run: |
          $env:UV_TOOL_BIN_DIR = "C:\Ancestry-MMM-Should-Fail\tools\uv\bin"
          powershell -NoProfile -ExecutionPolicy Bypass -File scripts/run_graphify_mcp.ps1
          if ($LASTEXITCODE -eq 0) {
            Write-Error "Launcher incorrectly succeeded with UV_TOOL_BIN_DIR pointed off D:"
            exit 1
          }
          $rejectedExitCode = $LASTEXITCODE
          Write-Host "Launcher correctly rejected the escaping UV_TOOL_BIN_DIR (exit $rejectedExitCode)."
          exit 0
      - name: Graphify CLI wrapper must reject a missing executable
        run: |
          # A fresh, never-installed D-drive root: the wrapper must fail
          # clearly rather than falling back to an ambient `graphify`.
          # setup-uv sets its own UV_TOOL_BIN_DIR for the project's uv tool
          # cache (unrelated to Graphify's isolated D-drive install) -
          # cleared here so this step genuinely exercises "no executable at
          # the resolved default location", not an unrelated ambient
          # override that would also (correctly, but for the wrong tested
          # reason) be rejected as outside the configured root.
          Remove-Item Env:\UV_TOOL_BIN_DIR -ErrorAction SilentlyContinue
          $env:MMM_DEV_ROOT = "D:\Ancestry-MMM-CLI-Wrapper-No-Install"
          powershell -NoProfile -ExecutionPolicy Bypass -File scripts/run_graphify_cli.ps1 extract . --code-only
          if ($LASTEXITCODE -eq 0) {
            Write-Error "CLI wrapper incorrectly succeeded with no graphify executable installed"
            exit 1
          }
          Write-Host "CLI wrapper correctly rejected the missing executable (exit $LASTEXITCODE)."
          exit 0
      - name: Graphify CLI wrapper must reject a sibling-prefix directory (ambient/unrelated Graphify cannot be selected)
        run: |
          # PR 88C: a bare string-prefix containment check would wrongly
          # accept this - "...-Graphify-CI-Evil" starts with the substring
          # "...-Graphify-CI". Simulates an ambient/unrelated Graphify
          # install living in a similarly-named sibling directory.
          $env:UV_TOOL_BIN_DIR = "D:\Ancestry-MMM-Graphify-CI-Evil\tools\uv\bin"
          powershell -NoProfile -ExecutionPolicy Bypass -File scripts/run_graphify_cli.ps1 extract . --code-only
          if ($LASTEXITCODE -eq 0) {
            Write-Error "CLI wrapper incorrectly succeeded with UV_TOOL_BIN_DIR pointed at a sibling-prefix directory"
            exit 1
          }
          Write-Host "CLI wrapper correctly rejected the sibling-prefix directory (exit $LASTEXITCODE)."
          exit 0
      - name: Graphify CLI wrapper must reject path traversal out of the configured root
        run: |
          $root = $env:MMM_DEV_ROOT
          $env:UV_TOOL_BIN_DIR = Join-Path $root "tools\..\..\Ancestry-MMM-Graphify-CI-Evil\tools\uv\bin"
          powershell -NoProfile -ExecutionPolicy Bypass -File scripts/run_graphify_cli.ps1 extract . --code-only
          if ($LASTEXITCODE -eq 0) {
            Write-Error "CLI wrapper incorrectly succeeded with a path-traversal UV_TOOL_BIN_DIR"
            exit 1
          }
          Write-Host "CLI wrapper correctly rejected the traversal path (exit $LASTEXITCODE)."
          exit 0
      - name: Graphify CLI wrapper must reject a tool-bin reparse point (junction) targeting the C drive
        run: |
          # PR 91A: textual containment (the sibling-prefix/traversal tests
          # above) cannot detect a directory that is textually under the
          # configured root but is physically a junction pointing at C: - a
          # real NTFS reparse point is required to prove the fix.
          #
          # `exit` inside a try{} does not reliably run its finally{} block
          # in Windows PowerShell, so every exit here happens AFTER the
          # try/finally has fully completed (cleanup is unconditional; pass/
          # fail is decided from a plain variable, not from inside try).
          $root = $env:MMM_DEV_ROOT
          $junctionPath = Join-Path $root "tools\uv\bin-junction-to-c"
          New-Item -ItemType Junction -Path $junctionPath -Target "C:\Windows" -Force | Out-Null
          $rejected = $false
          try {
            $env:UV_TOOL_BIN_DIR = $junctionPath
            powershell -NoProfile -ExecutionPolicy Bypass -File scripts/run_graphify_cli.ps1 extract . --code-only
            $rejected = ($LASTEXITCODE -ne 0)
          } finally {
            Remove-Item Env:\UV_TOOL_BIN_DIR -ErrorAction SilentlyContinue
            # [System.IO.Directory]::Delete (non-recursive) removes only the
            # junction/reparse point itself - Remove-Item -Recurse on a
            # junction instead follows it and deletes the TARGET's real
            # contents, which here would be C:\Windows or the sibling
            # directory. Never use -Recurse to clean up a junction.
            [System.IO.Directory]::Delete($junctionPath)
          }
          if (-not $rejected) {
            Write-Error "CLI wrapper incorrectly succeeded with a tool-bin junction physically targeting C:"
            exit 1
          }
          Write-Host "CLI wrapper correctly rejected the reparse-point (junction to C:) tool-bin directory."
          exit 0
      - name: Graphify CLI wrapper must reject a tool-bin reparse point (junction) targeting a D-drive sibling
        run: |
          $root = $env:MMM_DEV_ROOT
          $otherTarget = "D:\Ancestry-MMM-Graphify-CI-Junction-Target"
          New-Item -ItemType Directory -Path $otherTarget -Force | Out-Null
          $junctionPath = Join-Path $root "tools\uv\bin-junction-to-other"
          New-Item -ItemType Junction -Path $junctionPath -Target $otherTarget -Force | Out-Null
          $rejected = $false
          try {
            $env:UV_TOOL_BIN_DIR = $junctionPath
            powershell -NoProfile -ExecutionPolicy Bypass -File scripts/run_graphify_cli.ps1 extract . --code-only
            $rejected = ($LASTEXITCODE -ne 0)
          } finally {
            Remove-Item Env:\UV_TOOL_BIN_DIR -ErrorAction SilentlyContinue
            # [System.IO.Directory]::Delete (non-recursive) removes only the
            # junction/reparse point itself - Remove-Item -Recurse on a
            # junction instead follows it and deletes the TARGET's real
            # contents, which here would be C:\Windows or the sibling
            # directory. Never use -Recurse to clean up a junction.
            [System.IO.Directory]::Delete($junctionPath)
          }
          if (-not $rejected) {
            Write-Error "CLI wrapper incorrectly succeeded with a tool-bin junction physically targeting a D:-drive sibling"
            exit 1
          }
          Write-Host "CLI wrapper correctly rejected the reparse-point (junction to D:-drive sibling) tool-bin directory."
          exit 0
      - name: Graphify CLI wrapper must reject a reparse-point (symlink) executable
        run: |
          # Best-effort: creating a file symbolic link requires
          # SeCreateSymbolicLinkPrivilege, which may not be held by this
          # runner's process token even though it runs as Administrator.
          # If link creation itself fails, this step reports that the
          # scenario could not be exercised rather than a false pass.
          $root = $env:MMM_DEV_ROOT
          $exeReal = Join-Path $root "tools\uv\bin\graphify.exe"
          $exeBackup = "$exeReal.pr91a-real-backup"
          $outsideTarget = Join-Path $env:RUNNER_TEMP "graphify-outside-target.exe"
          Copy-Item $exeReal $outsideTarget -Force
          Rename-Item $exeReal (Split-Path $exeBackup -Leaf) -Force
          $linkCreated = $false
          try {
            New-Item -ItemType SymbolicLink -Path $exeReal -Target $outsideTarget -ErrorAction Stop | Out-Null
            $linkCreated = $true
          } catch {
            Write-Host "SKIPPED: this runner cannot create file symbolic links ($($_.Exception.Message)) - reparse-point-executable scenario not exercised. Junction-based root/tool-bin coverage above still proves the underlying Test-GraphifyPathHasReparsePoint logic."
          }
          # `exit` inside try{} does not reliably run its finally{} block in
          # Windows PowerShell, so pass/fail is decided from a plain
          # variable after this try/finally has fully completed (cleanup -
          # restoring the real graphify.exe - is unconditional).
          $rejected = $false
          try {
            if ($linkCreated) {
              powershell -NoProfile -ExecutionPolicy Bypass -File scripts/run_graphify_cli.ps1 extract . --code-only
              $rejected = ($LASTEXITCODE -ne 0)
            }
          } finally {
            Remove-Item $exeReal -Force -ErrorAction SilentlyContinue
            Rename-Item $exeBackup "graphify.exe" -Force
            Remove-Item $outsideTarget -Force -ErrorAction SilentlyContinue
          }
          if ($linkCreated -and -not $rejected) {
            Write-Error "CLI wrapper incorrectly succeeded with a symlinked graphify.exe"
            exit 1
          }
          if ($linkCreated) {
            Write-Host "CLI wrapper correctly rejected the reparse-point (symlink) executable."
          }
          exit 0
      - name: Build the graph through the CLI wrapper (clean D-drive build)
        run: |
          # setup-uv sets its own job-wide UV_TOOL_BIN_DIR for the project's
          # uv tool cache (D:\a\_temp\uv-tool-bin-dir) - unrelated to
          # Graphify's isolated D-drive install, and outside the configured
          # Graphify root, so the wrapper (correctly) rejects it. Cleared
          # here so resolution falls through to the wrapper's own default
          # (MMM_DEV_ROOT\tools\uv\bin), which is where setup_graphify.ps1
          # actually installed graphify.exe.
          Remove-Item Env:\UV_TOOL_BIN_DIR -ErrorAction SilentlyContinue
          powershell -NoProfile -ExecutionPolicy Bypass -File scripts/run_graphify_cli.ps1 extract . --code-only
          if ($LASTEXITCODE -ne 0) { Write-Error "CLI wrapper extract failed (exit $LASTEXITCODE)"; exit 1 }
          powershell -NoProfile -ExecutionPolicy Bypass -File scripts/run_graphify_cli.ps1 cluster-only . --no-label --no-viz
          if ($LASTEXITCODE -ne 0) { Write-Error "CLI wrapper cluster-only failed (exit $LASTEXITCODE)"; exit 1 }
          if (-not (Test-Path "graphify-out\graph.json")) { Write-Error "graphify-out\graph.json not produced"; exit 1 }
          Write-Host "Graph built successfully through the CLI wrapper."

  # -- Python 3.11 unit/integration ----------------------------------
  py311-tests:
    name: Python 3.11 tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v8.3.2
        with:
          python-version: "3.11"
          enable-cache: true
          cache-dependency-glob: "uv.lock"
      - run: uv sync --locked
      - name: Assert pinned pymc-marketing (3.11)
        env:
          EXPECTED_PYMC_MARKETING: "0.19.2"
        run: |
          uv run python -c "import os, pymc_marketing; assert pymc_marketing.__version__ == os.environ['EXPECTED_PYMC_MARKETING'], (pymc_marketing.__version__, os.environ['EXPECTED_PYMC_MARKETING'])" &&
          uv run pytest ancestry_mmm/tests/test_transformations.py -k pymc_marketing -v --no-cov
      - name: Run tests with coverage
        run: uv run pytest ancestry_mmm/tests/ -q --ignore=ancestry_mmm/tests/test_persistence.py --cov --cov-report=term-missing:skip-covered --cov-fail-under=75

  # -- Python 3.12 unit/integration ----------------------------------
  py312-tests:
    name: Python 3.12 tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v8.3.2
        with:
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: "uv.lock"
      - run: uv sync --locked
      - name: Assert pinned pymc-marketing (3.12)
        env:
          EXPECTED_PYMC_MARKETING: "0.19.4"
        run: |
          uv run python -c "import os, pymc_marketing; assert pymc_marketing.__version__ == os.environ['EXPECTED_PYMC_MARKETING'], (pymc_marketing.__version__, os.environ['EXPECTED_PYMC_MARKETING'])" &&
          uv run pytest ancestry_mmm/tests/test_transformations.py -k pymc_marketing -v --no-cov
      - name: Run tests with coverage
        run: uv run pytest ancestry_mmm/tests/ -q --ignore=ancestry_mmm/tests/test_persistence.py --cov --cov-report=term-missing:skip-covered --cov-fail-under=75

  # -- Ruff lint and format check -------------------------------------
  ruff:
    name: Ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v8.3.2
        with:
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: "uv.lock"
      - run: uv sync --locked
      - name: Run ruff check
        run: uv run ruff check ancestry_mmm
      - name: Run ruff format check
        run: uv run ruff format --check ancestry_mmm

  # -- Mypy type checking ---------------------------------------------
  mypy:
    name: Mypy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v8.3.2
        with:
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: "uv.lock"
      - run: uv sync --locked
      - name: Run mypy (planning + validation blocked)
        run: |
          uv run mypy ancestry_mmm/core/planning --ignore-missing-imports --follow-imports=silent
          uv run mypy ancestry_mmm/core/validation_policy.py --ignore-missing-imports --follow-imports=silent
          uv run mypy ancestry_mmm/application --ignore-missing-imports --follow-imports=silent
          uv run mypy ancestry_mmm/core --ignore-missing-imports || true  # 319 errors tracked in issue #78

  # -- Bandit security scan -------------------------------------------
  bandit:
    name: Bandit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v8.3.2
        with:
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: "uv.lock"
      - run: uv sync --locked
      - name: Run bandit
        run: uv run bandit -r ancestry_mmm/core -c pyproject.toml

  # -- pip-audit dependency scan --------------------------------------
  pip-audit:
    name: pip-audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v8.3.2
        with:
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: "uv.lock"
      - run: uv sync --locked
      - name: Export requirements and audit
        run: |
          uv pip compile pyproject.toml > /tmp/requirements.txt
          uv run pip-audit -r /tmp/requirements.txt
        continue-on-error: false  # Blocking enforcement active

  # -- Requirement-index conformance ----------------------------------
  req-index:
    name: Requirements index
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v8.3.2
        with:
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: "uv.lock"
      - run: uv sync --locked
      - name: Run requirement-index conformance tests
        run: uv run pytest ancestry_mmm/tests/test_requirements_index_conformance.py -v --no-cov

  # -- Streamlit AppTest ----------------------------------------------
  streamlit:
    name: Streamlit AppTest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v8.3.2
        with:
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: "uv.lock"
      - run: uv sync --locked
      - name: Run Streamlit smoke tests
        run: uv run pytest ancestry_mmm/tests/test_streamlit_smoke.py ancestry_mmm/tests/test_scenario_planner_apptest.py -v

  # -- Bundle round-trip ----------------------------------------------
  bundle:
    name: Bundle round-trip
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v8.3.2
        with:
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: "uv.lock"
      - run: uv sync --locked
      - name: Run bundle round-trip tests
        run: uv run pytest ancestry_mmm/tests/test_persistence.py -v

  # -- Deterministic attribution recovery (schedule/manual only) --
  # NOTE: This is NOT MCMC parameter recovery. It tests deterministic
  # replay and attribution using known parameters. A full MCMC recovery
  # test (fitting a PyMC model and evaluating posterior recovery) remains
  # uncommitted. See docs/approved_requirements/ for the capability roadmap.
  deterministic-recovery:
    name: Deterministic attribution recovery
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v8.3.2
        with:
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: "uv.lock"
      - run: uv sync --locked
      - name: Run deterministic attribution recovery tests
        run: uv run pytest ancestry_mmm/tests/test_simulation_recovery.py -v --tb=short
        timeout-minutes: 60
