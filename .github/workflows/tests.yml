name: Tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    # Weekly Monday morning deterministic attribution recovery run
    - cron: "0 6 * * 1"
  workflow_dispatch:
    inputs:
      reason:
        description: "Reason for manual run"
        required: false
        default: "Manual trigger"

jobs:
  # ── Early compile and import check ─────────────────────────────────
  compile-and-import:
    name: Compile + Import
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v8.3.2
        with:
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: "uv.lock"
      - run: uv sync --locked
      - name: Compile package
        run: uv run python -m compileall -q ancestry_mmm
      - name: Import critical modules
        run: |
          uv run python -c "import ancestry_mmm.core.validation_policy"
          uv run python -c "import ancestry_mmm.application.validation_service"
          uv run python -c "import ancestry_mmm.core.optimization"
          uv run python -c "import ancestry_mmm.core.planning_governance"
          uv run python -c "import ancestry_mmm.application.scenario_service"
          uv run python -c "import ancestry_mmm.core.persistence"
          uv run python -c "import ancestry_mmm.core.model_identity"

  # ── Windows dev-tooling integration ───────────────────────────────
  # Executes the PowerShell setup and checker scripts on Windows,
  # then starts Streamlit via the launcher and health-checks it.
  windows-tooling:
    name: Windows tooling
    runs-on: windows-latest
    defaults:
      run:
        shell: powershell
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v8.3.2
        with:
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: "uv.lock"
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: uv sync --locked
      - name: Set CI root and create temp tooling directory
        run: |
          $ciRoot = Join-Path $env:RUNNER_TEMP "Ancestry-MMM"
          "MMM_DEV_ROOT=$ciRoot" | Out-File -FilePath $env:GITHUB_ENV -Append
          Write-Host "CI root: $ciRoot"
      - name: Run setup script
        run: powershell -ExecutionPolicy Bypass -File scripts/setup_dev_tooling.ps1
      - name: Verify operational directories exist
        run: |
          $ciRoot = $env:MMM_DEV_ROOT
          foreach ($d in @("cache\npm","cache\ms-playwright","temp","test-artifacts\playwright-mcp","logs\mcp")) {
            $full = Join-Path $ciRoot $d
            if (Test-Path $full) { Write-Host "[OK] $full" } else { Write-Host "[FAIL] $full"; exit 1 }
          }
      - name: Install Chromium for CI
        run: |
          $env:PLAYWRIGHT_BROWSERS_PATH = Join-Path $env:MMM_DEV_ROOT "cache\ms-playwright"
          $env:npm_config_cache = Join-Path $env:MMM_DEV_ROOT "cache\npm"
          npx -y playwright@1.62.0 install chromium 2>&1
      - name: Run prerequisite checker
        run: powershell -ExecutionPolicy Bypass -File scripts/check_mcp_prereqs.ps1
      - name: Start Streamlit via launcher (background)
        run: |
          $job = Start-Job -ScriptBlock {
            $env:MMM_DEV_ROOT = $using:env:MMM_DEV_ROOT
            Set-Location $using:github.workspace
            powershell -ExecutionPolicy Bypass -File scripts/start_dev_app.ps1
          }
          Start-Sleep 30
          # Health check
          try {
            $response = Invoke-WebRequest -Uri "http://127.0.0.1:8501" -UseBasicParsing -TimeoutSec 10
            if ($response.StatusCode -eq 200) { Write-Host "Streamlit responded: HTTP 200" } else { throw "HTTP $($response.StatusCode)" }
          } catch {
            Write-Host "Streamlit health check failed: $_" -ForegroundColor Red
            Stop-Job $job
            Remove-Job $job -Force
            exit 1
          }
          # Cleanup
          Stop-Job $job
          Remove-Job $job -Force
          Start-Sleep 5
          $portInUse = Get-NetTCPConnection -LocalPort 8501 -State Listen -ErrorAction SilentlyContinue
          if ($portInUse) { Write-Host "Port 8501 still in use after cleanup" -ForegroundColor Yellow } else { Write-Host "Port 8501 free" }
        timeout-minutes: 5

  # ── Python 3.11 unit/integration ──────────────────────────────────
  py311-tests:
    name: Python 3.11 tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v8.3.2
        with:
          python-version: "3.11"
          enable-cache: true
          cache-dependency-glob: "uv.lock"
      - run: uv sync --locked
      - name: Assert pinned pymc-marketing (3.11)
        env:
          EXPECTED_PYMC_MARKETING: "0.19.2"
        run: |
          uv run python -c "import os, pymc_marketing; assert pymc_marketing.__version__ == os.environ['EXPECTED_PYMC_MARKETING'], (pymc_marketing.__version__, os.environ['EXPECTED_PYMC_MARKETING'])" &&
          uv run pytest ancestry_mmm/tests/test_transformations.py -k pymc_marketing -v --no-cov
      - name: Run tests with coverage
        run: uv run pytest ancestry_mmm/tests/ -q --ignore=ancestry_mmm/tests/test_persistence.py --cov --cov-report=term-missing:skip-covered --cov-fail-under=30

  # ── Python 3.12 unit/integration ──────────────────────────────────
  py312-tests:
    name: Python 3.12 tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v8.3.2
        with:
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: "uv.lock"
      - run: uv sync --locked
      - name: Assert pinned pymc-marketing (3.12)
        env:
          EXPECTED_PYMC_MARKETING: "0.19.4"
        run: |
          uv run python -c "import os, pymc_marketing; assert pymc_marketing.__version__ == os.environ['EXPECTED_PYMC_MARKETING'], (pymc_marketing.__version__, os.environ['EXPECTED_PYMC_MARKETING'])" &&
          uv run pytest ancestry_mmm/tests/test_transformations.py -k pymc_marketing -v --no-cov
      - name: Run tests with coverage
        run: uv run pytest ancestry_mmm/tests/ -q --ignore=ancestry_mmm/tests/test_persistence.py --cov --cov-report=term-missing:skip-covered --cov-fail-under=30

  # ── Ruff lint and format check ─────────────────────────────────────
  ruff:
    name: Ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v8.3.2
        with:
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: "uv.lock"
      - run: uv sync --locked
      - name: Run ruff check
        run: uv run ruff check ancestry_mmm
      - name: Run ruff format check
        run: uv run ruff format --check ancestry_mmm

  # ── Mypy type checking ─────────────────────────────────────────────
  mypy:
    name: Mypy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v8.3.2
        with:
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: "uv.lock"
      - run: uv sync --locked
      - name: Run mypy (planning + validation blocked)
        run: |
          uv run mypy ancestry_mmm/core/planning --ignore-missing-imports --follow-imports=silent
          uv run mypy ancestry_mmm/core/validation_policy.py --ignore-missing-imports --follow-imports=silent
          uv run mypy ancestry_mmm/application --ignore-missing-imports --follow-imports=silent
          uv run mypy ancestry_mmm/core --ignore-missing-imports || true

  # ── Bandit security scan ───────────────────────────────────────────
  bandit:
    name: Bandit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v8.3.2
        with:
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: "uv.lock"
      - run: uv sync --locked
      - name: Run bandit
        run: uv run bandit -r ancestry_mmm/core -c pyproject.toml

  # ── pip-audit dependency scan ──────────────────────────────────────
  pip-audit:
    name: pip-audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v8.3.2
        with:
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: "uv.lock"
      - run: uv sync --locked
      - name: Export requirements and audit
        run: |
          uv pip compile pyproject.toml > /tmp/requirements.txt
          uv run pip-audit -r /tmp/requirements.txt
        continue-on-error: true  # Blocking enforcement deferred - known advisories pending review

  # ── Requirement-index conformance ──────────────────────────────────
  req-index:
    name: Requirements index
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v8.3.2
        with:
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: "uv.lock"
      - run: uv sync --locked
      - name: Run requirement-index conformance tests
        run: uv run pytest ancestry_mmm/tests/test_requirements_index_conformance.py -v --no-cov

  # ── Streamlit AppTest ──────────────────────────────────────────────
  streamlit:
    name: Streamlit AppTest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v8.3.2
        with:
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: "uv.lock"
      - run: uv sync --locked
      - name: Run Streamlit smoke tests
        run: uv run pytest ancestry_mmm/tests/test_streamlit_smoke.py ancestry_mmm/tests/test_scenario_planner_apptest.py -v

  # ── Bundle round-trip ──────────────────────────────────────────────
  bundle:
    name: Bundle round-trip
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v8.3.2
        with:
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: "uv.lock"
      - run: uv sync --locked
      - name: Run bundle round-trip tests
        run: uv run pytest ancestry_mmm/tests/test_persistence.py -v

  # ── Deterministic attribution recovery (schedule/manual only) ──
  # NOTE: This is NOT MCMC parameter recovery. It tests deterministic
  # replay and attribution using known parameters. A full MCMC recovery
  # test (fitting a PyMC model and evaluating posterior recovery) remains
  # uncommitted. See docs/approved_requirements/ for the capability roadmap.
  deterministic-recovery:
    name: Deterministic attribution recovery
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v8.3.2
        with:
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: "uv.lock"
      - run: uv sync --locked
      - name: Run deterministic attribution recovery tests
        run: uv run pytest ancestry_mmm/tests/test_simulation_recovery.py -v --tb=short
        timeout-minutes: 60
