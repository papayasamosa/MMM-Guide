name: Named-event response evidence

on:
  schedule:
    # Weekly Monday morning named-event response evidence run
    - cron: "0 7 * * 1"
  workflow_dispatch:
    inputs:
      reason:
        description: "Reason for manual run"
        required: false
        default: "Manual trigger"

jobs:
  # WP2 (Media-Mix-Lab: Coding LLM Next Steps Post PR #297): synthetic-DGP
  # evidence for the candidate named-event response encodings (fixed
  # governed profile, low-dimensional parametric kernel, regularised
  # spline basis, unconstrained weekly dummies, partially pooled basis).
  # Decision support only - this job measures candidates and uploads the
  # results; it approves no statistical response method. Kept
  # schedule/manual-only, mirroring the candidate-a-recovery /
  # fold-refit-recovery jobs in tests.yml, because real NUTS sampling at
  # a meaningful budget is too slow for blocking PR/push CI. Lives in its
  # own workflow file so a single evidence run can be dispatched without
  # re-running the entire Tests workflow.
  named-event-response-recovery:
    name: Named-event response evidence
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v8.3.2
        with:
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: "uv.lock"
      - run: uv sync --locked
      - name: Run named-event response evaluation
        run: uv run python -m scripts.wp2_named_event_response.run_evaluation --out wp2_evidence_out
        timeout-minutes: 90
      - uses: actions/upload-artifact@v4
        with:
          name: wp2-named-event-evidence
          path: wp2_evidence_out/
          if-no-files-found: error
